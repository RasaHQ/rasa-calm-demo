version: "3.1"

slots:
  order_id:
    type: text
    mappings:
      - type: from_llm

actions:
  - action_process_refund_request

responses:
  utter_ask_order_id:
    - text: "Can you please share the concerned Order ID followed by a '#' key on your keypad?"
      translation:
        sr-RS: "Možete li podeliti ID narudžbine i pritisnuti '#' na vašoj tastaturi?"
  utter_invalid_order_id:
    - text: "That doesn't look like a valid Order ID! Order ID would be number with 4 to 6 digits at the top right section of the invoice."
      translation:
        sr-RS: "To ne izgleda kao validan ID narudžbine! ID narudžbine je broj sa 4 do 6 cifara u gornjem desnom uglu fakture."
  utter_refund_confirmation:
    - text: "Thank you, we have processed the refund request for the order {order_id}"
      translation:
        sr-RS: "Hvala, obradili smo zahtev za povraćaj za narudžbinu {order_id}"
