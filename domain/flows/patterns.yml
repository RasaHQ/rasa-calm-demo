version: "3.1"

slots:
  confirm_slot_correction:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_confirm_slot_correction:
    - text: "Do you want to update the {{ context.corrected_slots.keys()|join(', ') }}?"
      translation:
        sr-RS: "Da li želite da ažurirate {{ context.corrected_slots.keys()|join(', ') }}?"
      buttons:
        - payload: /SetSlots(confirm_slot_correction=true)
          title: "Yes"
          translation:
            sr-RS:
             payload: /SetSlots(confirm_slot_correction=true)
             title: "Da"
        - payload: /SetSlots(confirm_slot_correction=false)
          title: "No, please keep the previous information"
          translation:
            sr-RS:
              payload: /SetSlots(confirm_slot_correction=false)
              title: "Ne, molim vas zadržite prethodne informacije"
      metadata:
        rephrase: True
        template: jinja
  utter_not_corrected_previous_input:
    - text: Ok, I did not correct the previous input.
      metadata:
        rephrase: True
      translation:
        sr-RS: "U redu, nisam ispravio prethodni unos."
