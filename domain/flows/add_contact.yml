version: "3.1"

intents:
  - add_contact

actions:
  - add_contact
  - long_running_action

slots:
  add_contact_confirmation:
    type: bool
    mappings:
    - type: from_llm
  add_contact_name:
    type: text
    mappings:
    - type: from_llm
  add_contact_handle:
    type: text
    mappings:
      - type: from_llm

responses:
  utter_ask_add_contact_confirmation:
    - text: Do you want to add {add_contact_name}({add_contact_handle}) to your contacts?
      buttons:
        - payload: yes
          title: "Yes"
        - payload: no
          title: "No, cancel"
#  utter_ask_add_contact_handle:
#    - text: What' the name of the handle?
  utter_ask_add_contact_handle:
#    - text: <p>What's the name of the handle?</p>
#    - text: What's the name of the handle?
    - text: Your bill could be higher than usual for several reasons, such as annual fees being charged, use of additional services or subscriptions, roaming charges, or if you recently changed your tariff which can cause overlapping charges. If you want to file an objection, you can check the detailed reasons in your online account or contact A1 customer service for assistance. You can also review your bill and manage objections via the Mein A1 website or app.
  utter_ask_add_contact_name:
    - text: What's the name of the user you want to add?
  utter_add_contact_error:
    - text: Something went wrong, please try again.
  utter_add_contact_cancelled:
    - text: Okay, I am cancelling this adding of a contact.
  utter_contact_already_exists:
    - text: There's already a contact with that handle in your list.
  utter_contact_added:
    - text: Contact added successfully.
