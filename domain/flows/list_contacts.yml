version: "3.1"

actions:
  - list_contacts

slots:
  contacts_list:
    type: text
    mappings:
      - type: custom

responses:
  utter_no_contacts:
    - text: You have no contacts in your list.
      translation:
        sr-RS: "Nemate nijedan kontakt na vašoj listi."
  utter_list_contacts:
    - text: "You currently have the following contacts:\n {contacts_list}"
      translation:
        sr-RS: "Trenutno imate sledeće kontakte:\n {contacts_list}"
