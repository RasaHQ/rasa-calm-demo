addons.a2a_connector.A2AInputChannel:
  port: 8000
  # public_host is the address advertised in the agent card and used by the
  # orchestrator to send messages. Must be a routable hostname or IP — never
  # '0.0.0.0'. Use your machine's LAN IP when the orchestrator runs on a
  # different host.
  public_host: "localhost"
